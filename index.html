<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mars Login</title>

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container navbar">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/4f/Mars_logo.svg" alt="logo" class="logo">

            <div class="language">
                <i class="ri-global-line"></i>
                <span>O'zb</span>
            </div>
        </div>
    </header>

    <form class="main login_form">

        <div class="login-card">

            <div class="card-top">

                <img src="https://upload.wikimedia.org/wikipedia/commons/4/4f/Mars_logo.svg" class="logo-small">

                <a href="#">
                    Oferta imzolash
                    <i class="ri-login-box-line"></i>
                </a>

            </div>

            <h1>Spacega xush kelibsiz</h1>

            <div class="tabs">

                <button class="active">
                    O'quvchiman
                </button>

                <button>
                    Ota-onaman
                </button>

            </div>

            <div class="input-box">
                <input class="modme_input modme_login_input" type="text" placeholder="Modme Id or Phone number">
            </div>

            <div class="input-box password">

                <input class="password_input password_login_input" type="password" placeholder="Password">

                <i class="ri-eye-off-line"></i>

            </div>

            <p class="Register">
                Register
            </p>

            <button class="login-btn login_btn">
                Tasdiqlash
            </button>

        </div>

    </form>

    <form class="main modal hidden">

        <div class="login-card">

            <div class="card-top">

                <img src="https://upload.wikimedia.org/wikipedia/commons/4/4f/Mars_logo.svg" class="logo-small">

                <a href="#">
                    Oferta imzolash
                    <i class="ri-login-box-line"></i>
                </a>

            </div>

            <h1>Royhatdan o'tish </h1>



            <div class="input-box">
                <input class="modme_input register_modme_input" type="text" placeholder="Phone number">
            </div>

            <div class="input-box password">

                <input class="password_input register_password_input" type="password" placeholder="Password">

                <i class="ri-eye-off-line"></i>

            </div>

            <button class="login-btn register_password_btn">
                Tasdiqlash
            </button>

        </div>

    </form>

    <script src="app.js"></script>

</body>

</html>
