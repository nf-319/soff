<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <nav class="border-b border-gray-200 bg-white shadow-sm">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

    <!-- Logo -->
    <a
      href="#"
      class="text-2xl font-bold text-orange-500"
    >
      MyAPI
    </a>

    <!-- Menu -->
    <div class="flex items-center gap-2">

      <a
        href="#"
        class="rounded-lg px-4 py-2 text-sm font-medium text-gray-600 transition hover:bg-orange-50 hover:text-orange-500"
      >
        POST
      </a>

      <a
        href="#"
        class="rounded-lg px-4 py-2 text-sm font-medium text-gray-600 transition hover:bg-orange-50 hover:text-orange-500"
      >
        Cards
      </a>

      <a
        href="#"
        class="rounded-lg px-4 py-2 text-sm font-medium text-gray-600 transition hover:bg-orange-50 hover:text-orange-500"
      >
        Product
      </a>

      <a
        href="#"
        class="rounded-lg px-4 py-2 text-sm font-medium text-gray-600 transition hover:bg-orange-50 hover:text-orange-500"
      >
        Comments
      </a>

      <a
        href="#"
        class="rounded-lg px-4 py-2 text-sm font-medium text-gray-600 transition hover:bg-orange-50 hover:text-orange-500"
      >
        Users
      </a>

    </div>

  </div>
</nav>
    <div
        class="mx-auto mb-8 flex max-w-4xl flex-wrap items-end gap-4 rounded-2xl border border-gray-200 bg-white p-5 shadow-sm">

        <!-- Filter type -->
        <div class="min-w-[180px] flex-1">
            <label class="mb-2 block text-sm font-semibold text-gray-700">
                Filter by
            </label>

            <select id="filterType"
                class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100">
                <option value="name">Name</option>
                <option value="cuisine">Cuisine</option>
                <option value="difficulty">Difficulty</option>
                <option value="rating">Rating</option>
                <option value="caloriesPerServing">Calories</option>
            </select>
        </div>

        <!-- Filter value -->
        <div class="min-w-[220px] flex-[2]">
            <label class="mb-2 block text-sm font-semibold text-gray-700">
                Search
            </label>

            <input id="filterInput" type="text" placeholder="Masalan: Italian"
                class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100" />
        </div>

        <!-- Add button -->
        <button id="addFilter" onclick="postRecipes()"
            class="rounded-xl bg-orange-500 px-6 py-3 font-semibold text-white transition hover:bg-orange-600 active:scale-95">
            Add
        </button>

    </div>

    <!-- Filterlar chiqadigan joy -->
    <div id="activeFilters" class="mx-auto mb-6 flex max-w-4xl flex-wrap gap-2"></div>

    <main class="flex flex-wrap gap-[50px] justify-center">

    </main>


    <form id="recipeForm"
        class="hidden mx-auto max-w-3xl space-y-6 rounded-2xl border border-gray-200 bg-white p-10 shadow-lg absolute top-[0] left-[40%]">
        <!-- Title -->
        <div>
            <label class="mb-2 block text-sm font-semibold text-gray-700">
                Recipe Name
            </label>

            <input type="text" id="name" placeholder="Classic Margherita Pizza"
                class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none transition focus:border-orange-500 focus:ring-2 focus:ring-orange-100"
                required />
        </div>

        <!-- Ingredients -->
        <div>
            <label class="mb-2 block text-sm font-semibold text-gray-700">
                Ingredients
            </label>

            <textarea id="ingredients" rows="4" placeholder="Pizza dough, Tomato sauce, Mozzarella cheese..."
                class="w-full resize-none rounded-xl border border-gray-300 px-4 py-3 outline-none transition focus:border-orange-500 focus:ring-2 focus:ring-orange-100"
                required></textarea>

            <p class="mt-1 text-xs text-gray-400">
                Har bir ingredientni vergul bilan ajrating.
            </p>
        </div>

        <!-- Instructions -->
        <div>
            <label class="mb-2 block text-sm font-semibold text-gray-700">
                Instructions
            </label>

            <textarea id="instructions" rows="5" placeholder="Preheat the oven, Roll out the dough..."
                class="w-full resize-none rounded-xl border border-gray-300 px-4 py-3 outline-none transition focus:border-orange-500 focus:ring-2 focus:ring-orange-100"
                required></textarea>

            <p class="mt-1 text-xs text-gray-400">
                Har bir qadamni vergul bilan ajrating.
            </p>
        </div>

        <!-- Time -->
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
                <label class="mb-2 block text-sm font-semibold text-gray-700">
                    Prep Time (minutes)
                </label>

                <input type="number" id="prepTimeMinutes" placeholder="20" min="0"
                    class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500"
                    required />
            </div>

            <div>
                <label class="mb-2 block text-sm font-semibold text-gray-700">
                    Cook Time (minutes)
                </label>

                <input type="number" id="cookTimeMinutes" placeholder="15" min="0"
                    class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500"
                    required />
            </div>
        </div>

        <!-- Servings / Calories -->
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
                <label class="mb-2 block text-sm font-semibold text-gray-700">
                    Servings
                </label>

                <input type="number" id="servings" placeholder="4" min="1"
                    class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500"
                    required />
            </div>

            <div>
                <label class="mb-2 block text-sm font-semibold text-gray-700">
                    Calories Per Serving
                </label>

                <input type="number" id="caloriesPerServing" placeholder="300" min="0"
                    class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500"
                    required />
            </div>
        </div>

        <!-- Difficulty / Cuisine -->
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
                <label class="mb-2 block text-sm font-semibold text-gray-700">
                    Difficulty
                </label>

                <select id="difficulty"
                    class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 outline-none focus:border-orange-500"
                    required>
                    <option value="">Select difficulty</option>
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>

            <div>
                <label class="mb-2 block text-sm font-semibold text-gray-700">
                    Cuisine
                </label>

                <input type="text" id="cuisine" placeholder="Italian"
                    class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500"
                    required />
            </div>
        </div>

        <!-- Tags -->
        <div>
            <label class="mb-2 block text-sm font-semibold text-gray-700">
                Tags
            </label>

            <input type="text" id="tags" placeholder="Pizza, Italian"
                class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500" />

            <p class="mt-1 text-xs text-gray-400">
                Masalan: Pizza, Italian
            </p>
        </div>

        <!-- Image -->
        <div>
            <label class="mb-2 block text-sm font-semibold text-gray-700">
                Image URL
            </label>

            <input type="url" id="image" placeholder="https://example.com/pizza.jpg"
                class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500"
                required />
        </div>

        <!-- Rating / Review Count -->
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
                <label class="mb-2 block text-sm font-semibold text-gray-700">
                    Rating
                </label>

                <input type="number" id="rating" placeholder="4.6" min="0" max="5" step="0.1"
                    class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500" />
            </div>

            <div>
                <label class="mb-2 block text-sm font-semibold text-gray-700">
                    Review Count
                </label>

                <input type="number" id="reviewCount" placeholder="98" min="0"
                    class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500" />
            </div>
        </div>

        <!-- Meal Type -->
        <div>
            <label class="mb-2 block text-sm font-semibold text-gray-700">
                Meal Type
            </label>

            <select id="mealType"
                class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 outline-none focus:border-orange-500">
                <option value="">Select meal type</option>
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
                <option value="Snack">Snack</option>
            </select>
        </div>

        <!-- Button -->
        <button type="submit" id="post_btn"
            class="w-full rounded-xl bg-orange-500 px-5 py-3 font-semibold text-white transition hover:bg-orange-600 active:scale-[0.98]">
            Add Recipe
        </button>
    </form>




    <script src="app.js"></script>
</body>

</html>
