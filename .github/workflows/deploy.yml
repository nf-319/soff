name: CI and Deploy to Test Server with Zero Downtime

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.10.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy_package
          cp -R .next deploy_package/
          cp -R public deploy_package/
          cp package.json deploy_package/
          cp package-lock.json deploy_package/
          cp ecosystem.config.js deploy_package/

      - name: Deploy to test server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          password: ${{ secrets.TEST_SERVER_PASSWORD }}
          source: "deploy_package/*"
          target: "/tmp/"
          rm: true

      - name: Execute deployment script
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          password: ${{ secrets.TEST_SERVER_PASSWORD }}
          script: |
            #!/bin/bash

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20.10.0

            BASE_DIR="/root/frontend/test-subdomain-soffcrm-uz-3132"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            DEPLOY_DIR="${BASE_DIR}/releases/${TIMESTAMP}"
            CURRENT_LINK="${BASE_DIR}/current"

            mkdir -p ${DEPLOY_DIR}

            cp -R /tmp/deploy_package/* ${DEPLOY_DIR}/

            # Navigate to deployment directory
            cd ${DEPLOY_DIR}

            if [ -f "package-lock.json" ]; then
              npm ci
            else
              npm install --production
            fi

            PM2_NAME="test-subdomain-soffcrm-uz-3132"
            pm2 startOrReload ecosystem.config.js --only ${PM2_NAME} --update-env

            ln -sfn ${DEPLOY_DIR} ${CURRENT_LINK}

            pm2 save

            find ${BASE_DIR}/releases -maxdepth 1 -type d | sort -r | tail -n +6 | xargs -r rm -rf

            echo "Deployment completed successfully with zero downtime!"
