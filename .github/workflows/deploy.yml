name: Optimized Next.js Deployment

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.12.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create environment files
        run: |
          echo "${{ secrets.TEST_ENV_CONTENT }}" > .env

      - name: Build application
        run: npm run build

      - name: Prepare deployment package
        run: |
          # Faqat kerakli fayllarnigina zip qilish
          tar -czf deploy.tar.gz \
            .next/ \
            public/ \
            package.json \
            package-lock.json \
            ecosystem.config.js \
            .env

      - name: Deploy to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: crmroot
          password: ${{ secrets.TEST_SERVER_PASSWORD }}
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Execute deployment
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: crmroot
          password: ${{ secrets.TEST_SERVER_PASSWORD }}
          script: |
            TIMESTAMP=$(date +%s)
            APP_NAME="test-subdomain-soffcrm-uz-3132"
            BASE_DIR="/home/crmroot/frontend"
            DEPLOY_DIR="${BASE_DIR}/${APP_NAME}"
            NEW_DEPLOY_DIR="${DEPLOY_DIR}-${TIMESTAMP}"

            mkdir -p $NEW_DEPLOY_DIR

            tar -xzf /tmp/deploy.tar.gz -C $NEW_DEPLOY_DIR

            cd $NEW_DEPLOY_DIR

            if pm2 list | grep -q "$APP_NAME"; then
              pm2 start ecosystem.config.js --only "$APP_NAME-new"

              sleep 5
              if curl -s http://localhost:3000/api/health | grep -q "ok"; then
                pm2 delete "$APP_NAME"
                pm2 start ecosystem.config.js --only "$APP_NAME"
                pm2 delete "$APP_NAME-new"
                pm2 save

                rm -rf $DEPLOY_DIR
                ln -s $NEW_DEPLOY_DIR $DEPLOY_DIR

                cd $BASE_DIR
                ls -dt "$APP_NAME-"* | tail -n +4 | xargs -r rm -rf

                echo "Deployment completed successfully!"
              else
                pm2 delete "$APP_NAME-new"
                rm -rf $NEW_DEPLOY_DIR
                echo "Deployment failed! New version is not working properly."
              fi
            else
              pm2 start ecosystem.config.js --only "$APP_NAME"
              pm2 save

              rm -rf $DEPLOY_DIR
              ln -s $NEW_DEPLOY_DIR $DEPLOY_DIR

              echo "First deployment completed successfully!"
            fi
