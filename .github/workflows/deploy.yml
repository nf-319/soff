name: Next.js Frontend Deployment

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.12.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create environment files
        run: |
          echo "${{ secrets.TEST_ENV_CONTENT }}" > .env

      - name: Build application
        run: npm run build

      - name: Prepare deployment package
        run: |
          # Faqat kerakli fayllarnigina zip qilish
          tar -czf deploy.tar.gz \
            .next/ \
            public/ \
            package.json \
            package-lock.json \
            ecosystem.config.js \
            .env

      - name: Deploy to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: crmroot
          password: ${{ secrets.TEST_SERVER_PASSWORD }}
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Execute deployment
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: crmroot
          password: ${{ secrets.TEST_SERVER_PASSWORD }}
          script: |
            PM2_COMMAND="/home/crmroot/.nvm/versions/node/v20.10.0/bin/pm2"

            TIMESTAMP=$(date +%s)
            APP_NAME="test-subdomain-soffcrm-uz-3132"
            BASE_DIR="/home/crmroot/frontend"
            DEPLOY_DIR="${BASE_DIR}/${APP_NAME}"
            NEW_DEPLOY_DIR="${BASE_DIR}/${APP_NAME}-${TIMESTAMP}"

            echo "Deployment boshlandi: $(date)"
            echo "Yangi deploy papkasi: $NEW_DEPLOY_DIR"

            mkdir -p $NEW_DEPLOY_DIR

            echo "Build fayllarini extract qilish..."
            tar -xzf /tmp/deploy.tar.gz -C $NEW_DEPLOY_DIR

            cd $NEW_DEPLOY_DIR
            echo "Hozirgi papka: $(pwd)"

            set -x

            if $PM2_COMMAND list | grep -q "$APP_NAME"; then
              echo "Mavjud ilova topildi: $APP_NAME"

              echo "Yangi versiyani ishga tushirish..."
              $PM2_COMMAND start ecosystem.config.js --only "$APP_NAME-new" || true

              sleep 10

              if curl -s http://localhost:3100/api/health > /dev/null || curl -s http://localhost:3100 > /dev/null; then
                echo "Yangi versiya ishlayotgan ko'rinadi"

                echo "Eski versiyani o'chirish..."
                $PM2_COMMAND delete "$APP_NAME" || true

                echo "Asosiy versiyani ishga tushirish..."
                $PM2_COMMAND start ecosystem.config.js --only "$APP_NAME" || true

                echo "Vaqtinchalik versiyani o'chirish..."
                $PM2_COMMAND delete "$APP_NAME-new" || true

                $PM2_COMMAND save || true

                if [ -L "$DEPLOY_DIR" ]; then
                  echo "Mavjud symbolic link o'chirilmoqda..."
                  rm -f "$DEPLOY_DIR"
                elif [ -d "$DEPLOY_DIR" ]; then
                  echo "Mavjud papka zaxira nusxasi olinmoqda..."
                  mv "$DEPLOY_DIR" "${DEPLOY_DIR}-old-$(date +%s)" || true
                fi

                echo "Yangi symbolic link yaratilmoqda..."
                ln -sf "$NEW_DEPLOY_DIR" "$DEPLOY_DIR"

                echo "Eski versiyalarni tozalash..."
                cd $BASE_DIR
                ls -dt "${APP_NAME}-"* | grep -v "$(basename $NEW_DEPLOY_DIR)" | tail -n +3 | xargs -r rm -rf

                echo "Deployment muvaffaqiyatli tugadi!"
              else
                echo "XATO: Yangi versiya ishlamayapti!"

                $PM2_COMMAND delete "$APP_NAME-new" || true

                rm -rf "$NEW_DEPLOY_DIR"

                echo "Oldingi versiyaga qaytildi."
              fi
            else
              echo "Birinchi marta deploy qilish..."

              $PM2_COMMAND start ecosystem.config.js --only "$APP_NAME" || true
              $PM2_COMMAND save || true

              if [ -L "$DEPLOY_DIR" ]; then
                rm -f "$DEPLOY_DIR"
              elif [ -d "$DEPLOY_DIR" ]; then
                mv "$DEPLOY_DIR" "${DEPLOY_DIR}-old-$(date +%s)" || true
              fi

              ln -sf "$NEW_DEPLOY_DIR" "$DEPLOY_DIR"

              echo "Birinchi deployment muvaffaqiyatli tugadi!"
            fi

            echo "PM2 jarayonlari:"
            $PM2_COMMAND list

            echo "Frontend papkasidagi fayllar:"
            ls -la $BASE_DIR
