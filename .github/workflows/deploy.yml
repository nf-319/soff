name: CI and Deploy to Test/Production Servers

on:
  push:
    branches:
      - test
      - main

jobs:
  build-and-deploy-test:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/test'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.10.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create env file
        run: echo "${{ secrets.TEST_ENV_CONTENT }}" > .env

      - name: Build application
        run: npm run build

      - name: Debug directories
        run: |
          echo "Content of root directory:"
          ls -la
          echo "Content of public directory:"
          ls -la public/ || echo "Public directory not found"
          echo "Content of .next directory:"
          ls -la .next/ || echo ".next directory not found"

      - name: Create deployment archive
        run: |
          # Make sure we include BOTH .next and public directories explicitly
          echo "Creating comprehensive deployment archive..."
          tar -czvf deployment.tar.gz \
            --exclude=".git" \
            --exclude="node_modules" \
            --exclude="src" \
            .next/ package.json package-lock.json .env next.config.js ecosystem.config.js public/

      - name: Upload build files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          password: ${{ secrets.TEST_SERVER_PASSWORD }}
          source: "deployment.tar.gz"
          target: "/tmp"

      - name: Deploy to test server
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          password: ${{ secrets.TEST_SERVER_PASSWORD }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20.10.0

            APP_NAME="${{ secrets.REPO_NAME }}"
            BASE_DIR="frontend/test-subdomain-soffcrm-uz-3132"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            DEPLOY_DIR="${BASE_DIR}/releases/${TIMESTAMP}"
            BLUE_LINK="${BASE_DIR}/blue"
            GREEN_LINK="${BASE_DIR}/green"
            CURRENT_LINK="${BASE_DIR}/current"

            # Create deployment directory structure
            mkdir -p ${BASE_DIR}/releases
            mkdir -p ${DEPLOY_DIR}

            # Extract deployment archive
            cd ${DEPLOY_DIR}
            echo "Extracting deployment archive..."
            tar -xzf /tmp/deployment.tar.gz
            rm -f /tmp/deployment.tar.gz

            # Debug deployment contents
            echo "Deployed files:"
            ls -la
            echo "Public directory contents:"
            ls -la public/ || echo "Public directory missing after extraction!"
            echo ".next directory contents:"
            ls -la .next/ || echo ".next directory missing after extraction!"

            # Check for localization files specifically
            if [ -d "public/locales" ]; then
              echo "Localization directory exists:"
              ls -la public/locales/
            else
              echo "WARNING: Localization directory not found in deployed files!"
            fi

            # Install production dependencies
            echo "Installing production dependencies..."
            npm ci --prefer-offline --no-audit --production --legacy-peer-deps

            # Determine target environment (blue/green)
            if [ -L "${CURRENT_LINK}" ] && [ -e "${CURRENT_LINK}" ]; then
              CURRENT_ENV=$(basename $(readlink -f ${CURRENT_LINK}))
              if [[ "${CURRENT_ENV}" == "blue" ]]; then
                TARGET_ENV="${GREEN_LINK}"
                TARGET_NAME="green"
              else
                TARGET_ENV="${BLUE_LINK}"
                TARGET_NAME="blue"
              fi
            else
              TARGET_ENV="${BLUE_LINK}"
              TARGET_NAME="blue"
            fi

            echo "Targeting ${TARGET_NAME} environment for new deployment"
            ln -sfn ${DEPLOY_DIR} ${TARGET_ENV}

            # Ensure the public directory is properly copied to the deployment directory
            echo "Verifying public directory structure..."
            if [ ! -d "public" ]; then
              echo "Public directory missing in deployment, creating it..."
              mkdir -p public
            fi

            # Ensure NextJS can find static files in the correct location
            echo "Checking next.config.js settings..."
            grep -q "distDir" next.config.js || echo "Note: No custom distDir found in next.config.js"

            # Update PM2 name in ecosystem config
            PM2_NAME="test-subdomain-soffcrm-uz-3132"
            sed -i "s/name: \"${APP_NAME}-test\"/name: \"${PM2_NAME}\"/" ecosystem.config.js

            # Start or reload PM2 process
            if pm2 show ${PM2_NAME} > /dev/null 2>&1; then
              echo "Reloading ${PM2_NAME} with new deployment..."
              pm2 reload ecosystem.config.js --only ${PM2_NAME} --update-env
            else
              echo "Starting new PM2 process: ${PM2_NAME}"
              pm2 start ecosystem.config.js --only ${PM2_NAME}
            fi

            # Wait for app to initialize
            echo "Waiting for service initialization (5 seconds)..."
            sleep 5

            # Switch traffic to new environment
            echo "Switching traffic to ${TARGET_NAME} environment"
            ln -sfn ${TARGET_ENV} ${CURRENT_LINK}
            pm2 save

            # Clean up old releases (keep only 5 most recent)
            echo "Cleaning up old releases..."
            cd ${BASE_DIR}/releases
            ls -t | tail -n +6 | xargs -r rm -rf

            echo "Deployment completed successfully!"
            echo "Current environment: ${TARGET_NAME}"

