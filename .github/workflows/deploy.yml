name: CI and Deploy to Test/Production Servers

on:
  push:
    branches:
      - test
      - main

jobs:
  build-and-deploy-test:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/test'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.10.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create env file
        run: echo "${{ secrets.TEST_ENV_CONTENT }}" > .env

      - name: Build application locally
        run: npm run build

      - name: Debug project structure
        run: |
          echo "Current directory structure before packaging:"
          ls -la
          echo "Public directory contents:"
          if [ -d "public" ]; then
            ls -la public/
          else
            echo "Public directory doesn't exist in source project!"
          fi

      - name: Create deployment archive
        run: |
          # Check public directory existence
          if [ ! -d "public" ]; then
            echo "WARNING: Public directory not found! Creating an empty one for now."
            mkdir -p public
          fi

          # Create deployment archive including public directory
          tar -czvf deployment.tar.gz \
            --exclude=".git" \
            --exclude="node_modules" \
            .next/ package.json package-lock.json .env next.config.js ecosystem.config.js public/

      - name: Upload build files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          password: ${{ secrets.TEST_SERVER_PASSWORD }}
          source: "deployment.tar.gz"
          target: "/tmp"

      - name: Deploy to test server with blue-green deployment
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          password: ${{ secrets.TEST_SERVER_PASSWORD }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20.10.0

            APP_NAME="${{ secrets.REPO_NAME }}"
            BASE_DIR="frontend/test-subdomain-soffcrm-uz-3131"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)

            DEPLOY_DIR="${BASE_DIR}/releases/${TIMESTAMP}"
            BLUE_LINK="${BASE_DIR}/blue"
            GREEN_LINK="${BASE_DIR}/green"
            CURRENT_LINK="${BASE_DIR}/current"

            echo "Creating deployment directory structure..."
            mkdir -p ${BASE_DIR}/releases
            mkdir -p ${DEPLOY_DIR}

            GIT_DIR="${BASE_DIR}/repo"
            if [ -d "${GIT_DIR}" ]; then
              echo "Updating existing git repository..."
              cd ${GIT_DIR}
              git fetch origin test
              git reset --hard origin/test
            else
              echo "Cloning repository..."
              git clone --branch test https://Soff-Hub:${{ secrets.TOKEN_GITHUB }}@github.com/Soff-Hub/${APP_NAME}.git ${GIT_DIR}
            fi

            cd ${GIT_DIR}
            GIT_REV=$(git rev-parse HEAD)
            GIT_BRANCH=$(git symbolic-ref --short HEAD)
            GIT_MESSAGE=$(git log -1 --pretty=%B)

            # Check if public directory exists in repo
            if [ ! -d "public" ]; then
              echo "WARNING: Public directory not found in repository!"
            else
              echo "Public directory found in repository:"
              ls -la public/
            fi

            echo "Creating revision info file..."
            cat > ${DEPLOY_DIR}/REVISION.txt <<EOL
            Branch: ${GIT_BRANCH}
            Commit: ${GIT_REV}
            Message: ${GIT_MESSAGE}
            Deployed: $(date)
            EOL

            cd ${DEPLOY_DIR}
            echo "Extracting deployment archive..."
            tar -xzf /tmp/deployment.tar.gz
            rm -f /tmp/deployment.tar.gz

            echo "Verifying deployment contents..."
            if [ -d "public" ]; then
              echo "Public directory exists in deployment"
              ls -la public/
            else
              echo "Public directory missing after extraction! Copying from git repository..."
              mkdir -p public
              cp -r ${GIT_DIR}/public/* ./public/
              echo "After copying from git repository:"
              ls -la public/
            fi

            echo "Installing production dependencies..."
            npm ci --prefer-offline --no-audit --production --legacy-peer-deps

            if [ -L "${CURRENT_LINK}" ]; then
              CURRENT_ENV=$(basename $(readlink -f ${CURRENT_LINK}))
              if [[ "${CURRENT_ENV}" == "blue" ]]; then
                TARGET_ENV="${GREEN_LINK}"
                TARGET_NAME="green"
              else
                TARGET_ENV="${BLUE_LINK}"
                TARGET_NAME="blue"
              fi
            else
              TARGET_ENV="${BLUE_LINK}"
              TARGET_NAME="blue"
            fi

            echo "Targeting ${TARGET_NAME} environment for new deployment"

            ln -sfn ${DEPLOY_DIR} ${TARGET_ENV}

            PM2_NAME="test-subdomain-soffcrm-uz-3132"

            sed -i "s/name: \"${APP_NAME}-test\"/name: \"${PM2_NAME}\"/" ecosystem.config.js

            if pm2 show ${PM2_NAME} > /dev/null 2>&1; then
              echo "Reloading ${TARGET_NAME} environment with new deployment"
              pm2 reload ecosystem.config.js --only ${PM2_NAME} --update-env
            else
              echo "Starting new ${TARGET_NAME} environment"
              pm2 start ecosystem.config.js --only ${PM2_NAME}
            fi

            echo "Waiting for new instance to initialize (10 seconds)..."
            sleep 10

            echo "Switching traffic to ${TARGET_NAME} environment"
            ln -sfn ${TARGET_ENV} ${CURRENT_LINK}

            pm2 save

            OLD_ENV_NAME="${APP_NAME}-test-$([ "${TARGET_NAME}" == "blue" ] && echo "green" || echo "blue")"
            if pm2 show ${OLD_ENV_NAME} > /dev/null 2>&1; then
              echo "Waiting 30 seconds before stopping old environment..."
              sleep 30
              echo "Stopping old environment: ${OLD_ENV_NAME}"
              pm2 stop ${OLD_ENV_NAME}
            fi

            echo "Cleaning up old releases..."
            cd ${BASE_DIR}/releases
            ls -t | tail -n +6 | xargs -r rm -rf

            echo "Deployment completed successfully!"
            echo "Current environment: ${TARGET_NAME}"
            echo "Deployed commit: ${GIT_REV}"
            echo "Commit message: ${GIT_MESSAGE}"

  build-and-deploy-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
