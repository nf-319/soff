name: CI and Deploy to Server

on:
  push:
    branches:
      - test
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js (local runner)
        uses: actions/setup-node@v3
        with:
          node-version: '20.12.2'
          cache: 'npm'

      - name: Install dependencies (local runner)
        run: npm ci

      - name: Create env file
        run: |
          touch .env
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "${{ secrets.PROD_ENV_CONTENT }}" > .env
          else
            echo "${{ secrets.TEST_ENV_CONTENT }}" > .env
          fi

      - name: Build project locally
        run: npm run build

      - name: Deploy to production server (for main branch)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ubuntu
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          script: |
            # Xavfsiz direktiva - xatolar yuzaga kelganda skript to'xtaydi
            set -e

            # Log fayli uchun yo'l
            LOG_FILE=$HOME/deployment-logs/$(date +%Y%m%d-%H%M%S)-deploy.log
            mkdir -p $HOME/deployment-logs

            # NVM o'rnatilganligini tekshirish va kerakli Node.js versiyasini tanlash
            {
              echo "===== DEPLOYMENT STARTED: $(date) ====="
              if [ ! -d "$HOME/.nvm" ]; then
                echo "Installing NVM..."
                curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.2/install.sh | bash
                export NVM_DIR="$HOME/.nvm"
                [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              else
                echo "NVM already installed, sourcing..."
                export NVM_DIR="$HOME/.nvm"
                [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              fi

              echo "Setting Node version..."
              nvm install 20.10.0
              nvm use 20.10.0

              # Loyihaning joylashuvini yaratish
              echo "Creating project directory..."
              mkdir -p ~/CRMFrondEnd/cicd/${{ secrets.REPO_NAME }}
              cd ~/CRMFrondEnd/cicd/${{ secrets.REPO_NAME }}

              # Loyihani olish
              if [ ! -d ".git" ]; then
                echo "Cloning repository..."
                git clone --branch main https://Soff-Hub:${{ secrets.TOKEN_GITHUB }}@github.com/Soff-Hub/${{ secrets.REPO_NAME }}.git .
              else
                echo "Pulling latest changes..."
                git fetch --all
                git reset --hard origin/main
              fi

              # .env faylini yuklash
              echo "Creating environment file..."
              echo "${{ secrets.PROD_ENV_CONTENT }}" > .env

              # PM2 mavjudligini tekshirish va o'rnatish
              if ! command -v pm2 &> /dev/null; then
                echo "Installing PM2 globally..."
                npm install -g pm2
              fi

              # PM2 orqali jarayonlarni boshqarish - avval zaxira nusxa yaratish
              if pm2 list | grep -q "subdomain-soffcrm-uz-3132"; then
                echo "Taking backup of previous build..."
                # Oldingi build'ni zaxiralash
                mkdir -p ~/backups
                BACKUP_DIR=~/backups/$(date +%Y%m%d-%H%M%S)-${{ secrets.REPO_NAME }}
                cp -r .next $BACKUP_DIR || true

                echo "Stopping the application gracefully..."
                pm2 stop subdomain-soffcrm-uz-3132 || true
              fi

              # Yangi dependencylarni o'rnatish
              echo "Installing dependencies..."
              export NODE_OPTIONS="--max-old-space-size=4096"
              npm ci

              # Loyihani build qilish
              echo "Building project..."
              npm run build

              # Ishga tushirish
              echo "Starting/restarting application..."
              if pm2 list | grep -q "subdomain-soffcrm-uz-3132"; then
                pm2 restart subdomain-soffcrm-uz-3132
              else
                pm2 start npm --name subdomain-soffcrm-uz-3132 -- start
              fi

              pm2 save
              echo "===== DEPLOYMENT COMPLETED: $(date) ====="
            } 2>&1 | tee -a $LOG_FILE

            # Deployment muvaffaqiyatli yakunlanganligi haqida xabar
            if [ $? -eq 0 ]; then
              echo "Deployment completed successfully!"
            else
              echo "Deployment failed! Check logs at $LOG_FILE"
              exit 1
            fi

      - name: Deploy to development server (for test branch)
        if: github.ref == 'refs/heads/test'
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          password: ${{ secrets.TEST_SERVER_PASSWORD }}
          script: |
            # Xavfsiz direktiva - xatolar yuzaga kelganda skript to'xtaydi
            set -e

            # Log fayli uchun yo'l
            LOG_FILE=/root/deployment-logs/$(date +%Y%m%d-%H%M%S)-deploy.log
            mkdir -p /root/deployment-logs

            # NVM o'rnatilganligini tekshirish va kerakli Node.js versiyasini tanlash
            {
              echo "===== DEPLOYMENT STARTED: $(date) ====="
              if [ ! -d "$HOME/.nvm" ]; then
                echo "Installing NVM..."
                curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.2/install.sh | bash
                export NVM_DIR="$HOME/.nvm"
                [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              else
                echo "NVM already installed, sourcing..."
                export NVM_DIR="$HOME/.nvm"
                [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              fi

              echo "Setting Node version..."
              nvm install 20.10.0
              nvm use 20.10.0

              # Loyihaning joylashuvini yaratish
              echo "Creating project directory..."
              mkdir -p /projects/crm-front/${{ secrets.REPO_NAME }}
              cd /projects/crm-front/${{ secrets.REPO_NAME }}

              # Loyihani olish
              if [ ! -d ".git" ]; then
                echo "Cloning repository..."
                git clone --branch test https://Soff-Hub:${{ secrets.TOKEN_GITHUB }}@github.com/Soff-Hub/${{ secrets.REPO_NAME }}.git .
              else
                echo "Pulling latest changes..."
                git fetch --all
                git reset --hard origin/test
              fi

              # .env faylini yuklash
              echo "Creating environment file..."
              echo "${{ secrets.TEST_ENV_CONTENT }}" > .env

              # PM2 mavjudligini tekshirish va o'rnatish
              if ! command -v pm2 &> /dev/null; then
                echo "Installing PM2 globally..."
                npm install -g pm2
              fi

              # PM2 orqali jarayonlarni boshqarish - avval zaxira nusxa yaratish
              if pm2 list | grep -q "${{ secrets.REPO_NAME }}-test"; then
                echo "Taking backup of previous build..."
                # Oldingi build'ni zaxiralash
                mkdir -p /root/backups
                BACKUP_DIR=/root/backups/$(date +%Y%m%d-%H%M%S)-${{ secrets.REPO_NAME }}
                mkdir -p $BACKUP_DIR
                cp -r .next $BACKUP_DIR || true

                echo "Stopping the application gracefully..."
                pm2 stop ${{ secrets.REPO_NAME }}-test || true
              fi

              # Yangi dependencylarni o'rnatish
              echo "Installing dependencies..."
              export NODE_OPTIONS="--max-old-space-size=4096"
              npm ci

              # Loyihani build qilish
              echo "Building project..."
              npm run build

              # Ishga tushirish
              echo "Starting/restarting application..."
              if pm2 list | grep -q "${{ secrets.REPO_NAME }}-test"; then
                pm2 restart ${{ secrets.REPO_NAME }}-test
              else
                pm2 start npm --name ${{ secrets.REPO_NAME }}-test -- start
              fi

              pm2 save
              echo "===== DEPLOYMENT COMPLETED: $(date) ====="
            } 2>&1 | tee -a $LOG_FILE

            # Deployment muvaffaqiyatli yakunlanganligi haqida xabar
            if [ $? -eq 0 ]; then
              echo "Deployment completed successfully!"
            else
              echo "Deployment failed! Check logs at $LOG_FILE"
              exit 1
            fi
