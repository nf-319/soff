name: NextJS Frontend CI/CD Workflow

on:
  push:
    branches:
      - main
      - test
      - development

jobs:
  lint-and-test:
    name: Lint va Test
    runs-on: ubuntu-latest
    steps:
      - name: Repositoryni klon qilish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: `.env` faylini yaratish
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Paketlarni o'rnatish
        run: npm ci

  build-and-deploy:
    name: Build va Deploy
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test' || github.ref == 'refs/heads/development'

    steps:
      - name: Repositoryni klon qilish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: `.env` faylini yaratish
        run: |
          if [[ $GITHUB_REF_NAME == "main" ]]; then
            echo "${{ secrets.PROD_ENV_FILE }}" > .env
          elif [[ $GITHUB_REF_NAME == "test" ]]; then
            echo "${{ secrets.TEST_ENV_FILE }}" > .env
          else
            echo "${{ secrets.DEV_ENV_FILE }}" > .env
          fi

      - name: Build yaratish
        run: |
          npm ci
          npm run build

      - name: Deploy qilish uchun serverga bog'lanish
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ github.ref_name == 'main' && secrets.PROD_SERVER_HOST || github.ref_name == 'test' && secrets.TEST_SERVER_HOST || secrets.DEV_SERVER_HOST }}
          username: ${{ github.ref_name == 'main' && secrets.PROD_SERVER_USER || github.ref_name == 'test' && secrets.TEST_SERVER_USER || secrets.DEV_SERVER_USER }}
          key: ${{ github.ref_name == 'main' && secrets.PROD_SERVER_SSH_KEY || github.ref_name == 'test' && secrets.TEST_SERVER_SSH_KEY || secrets.DEV_SERVER_SSH_KEY }}
          script: |
            set -e
            PROJECT_DIR="/projects/frontend/${{ github.ref_name }}"
            mkdir -p $PROJECT_DIR

            # Avvalgi versiyani backup qilish
            if [ -d "${PROJECT_DIR}/.next" ]; then
              BACKUP_DIR="${PROJECT_DIR}_backup_$(date +%Y%m%d_%H%M%S)"
              mkdir -p $BACKUP_DIR
              cp -r ${PROJECT_DIR}/.next ${PROJECT_DIR}/package.json ${PROJECT_DIR}/package-lock.json $BACKUP_DIR
            fi

      - name: Build fayllarni yuborish
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ github.ref_name == 'main' && secrets.PROD_SERVER_HOST || github.ref_name == 'test' && secrets.TEST_SERVER_HOST || secrets.DEV_SERVER_HOST }}
          username: ${{ github.ref_name == 'main' && secrets.PROD_SERVER_USER || github.ref_name == 'test' && secrets.TEST_SERVER_USER || secrets.DEV_SERVER_USER }}
          key: ${{ github.ref_name == 'main' && secrets.PROD_SERVER_SSH_KEY || github.ref_name == 'test' && secrets.TEST_SERVER_SSH_KEY || secrets.DEV_SERVER_SSH_KEY }}
          source: '.next/,public/,package.json,package-lock.json,next.config.js,.env'
          target: '/projects/frontend/${{ github.ref_name }}'

      - name: Application'ni restart qilish
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ github.ref_name == 'main' && secrets.PROD_SERVER_HOST || github.ref_name == 'test' && secrets.TEST_SERVER_HOST || secrets.DEV_SERVER_HOST }}
          username: ${{ github.ref_name == 'main' && secrets.PROD_SERVER_USER || github.ref_name == 'test' && secrets.TEST_SERVER_USER || secrets.DEV_SERVER_USER }}
          key: ${{ github.ref_name == 'main' && secrets.PROD_SERVER_SSH_KEY || github.ref_name == 'test' && secrets.TEST_SERVER_SSH_KEY || secrets.DEV_SERVER_SSH_KEY }}
          script: |
            set -e
            cd /projects/frontend/${{ github.ref_name }}

            # Node.js versiyasini tanlash
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 20 || nvm install 20

            # PM2 bilan servisni boshqarish
            SERVICE_NAME="nextjs-app-${{ github.ref_name }}"

            if pm2 list | grep -q "$SERVICE_NAME"; then
              pm2 restart "$SERVICE_NAME"
            else
              pm2 start npm --name "$SERVICE_NAME" -- start
            fi

            pm2 save
            echo "Deploy muvaffaqiyatli yakunlandi!"
