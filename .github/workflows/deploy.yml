name: CI and Deploy to Server

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js (local runner)
        uses: actions/setup-node@v3
        with:
          node-version: 'v20.12.2'

      - name: Install dependencies (local runner)
        run: npm install

      - name: create env file
        run: |
          touch .env
          echo "${{ secrets.TEST_ENV_CONTENT }}" >> .env
          touch .env
          echo "${{ secrets.PROD_ENV_CONTENT }}" >> .env

      - name: Deploy to development server (for test branch)
        if: github.ref == 'refs/heads/test'
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          password: ${{ secrets.TEST_SERVER_PASSWORD }}
          script: |
            if [ ! -d "$HOME/.nvm" ]; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.2/install.sh | bash
              source ~/.nvm/nvm.sh
            else
              source ~/.nvm/nvm.sh
            fi
            nvm use 20.10.0

            mkdir -p frontend/prod-subdomain-soffcrm-uz-3132/${{ secrets.REPO_NAME }}
            cd frontend/prod-subdomain-soffcrm-uz-3132/${{ secrets.REPO_NAME }}
            if [ ! -d ".git" ]; then
                git clone --branch test https://Soff-Hub:${{ secrets.TOKEN_GITHUB }}@github.com/Soff-Hub/${{ secrets.REPO_NAME }}.git .
            else
                git stash
                git pull origin test
            fi

            echo "${{ secrets.TEST_ENV_CONTENT }}" > .env

            npm install
            npm run build

            pm2 startOrReload ecosystem.config.js --only test-subdomain-soffcrm-uz-3132
            pm2 save
