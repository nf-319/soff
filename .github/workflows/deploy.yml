name: CI and Deploy to Server

on:
  push:
    branches:
      - test
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js (local runner)
        uses: actions/setup-node@v3
        with:
          node-version: 'v20.12.2'

      - name: Install dependencies (local runner)
        run: npm install

      - name: create env file
        run: |
          touch .env
          echo "${{ secrets.TEST_ENV_CONTENT }}" >> .env
          touch .env
          echo "${{ secrets.PROD_ENV_CONTENT }}" >> .env

      - name: Deploy to production server (for main branch)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ubuntu
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          script: |
            # NVM o'rnatilganligini tekshirish va kerakli Node.js versiyasini tanlash
            if [ ! -d "$HOME/.nvm" ]; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.2/install.sh | bash
              source ~/.nvm/nvm.sh
            else
              source ~/.nvm/nvm.sh
            fi
            nvm use 20.10.0

            # Loyihaning joylashuvini yaratish va loyihani olish
            mkdir -p ~/CRMFrondEnd/cicd/${{ secrets.REPO_NAME }}
            cd ~/CRMFrondEnd/cicd/${{ secrets.REPO_NAME }}
            if [ ! -d ".git" ]; then
                git clone --branch main https://Soff-Hub:${{ secrets.TOKEN_GITHUB }}@github.com/Soff-Hub/${{ secrets.REPO_NAME }}.git .
            else
                git pull origin main
            fi

            # .env faylini yuklash
            echo "${{ secrets.PROD_ENV_CONTENT }}" > .env

            # Kerakli kutubxonalarni o'rnatish va loyihani build qilish
            npm install
            npm run build

            # PM2 orqali jarayonlarni boshqarish
            pm2 restart subdomain-soffcrm-uz-3132 || pm2 start npm --name subdomain-soffcrm-uz-3132 -- start
            pm2 save

      - name: Deploy to development server (for test branch)
        if: github.ref == 'refs/heads/test'
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          password: ${{ secrets.TEST_SERVER_PASSWORD }}
          script: |
            # NVM o'rnatilganligini tekshirish va kerakli Node.js versiyasini tanlash
            if [ ! -d "$HOME/.nvm" ]; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.2/install.sh | bash
              source ~/.nvm/nvm.sh
            else
              source ~/.nvm/nvm.sh
            fi
            nvm use 20.10.0

            # Loyihaning joylashuvini yaratish va loyihani olish
            mkdir -p /projects/crm-front/${{ secrets.REPO_NAME }}
            cd /projects/crm-front/${{ secrets.REPO_NAME }}
            if [ ! -d ".git" ]; then
                git clone --branch test https://Soff-Hub:${{ secrets.TOKEN_GITHUB }}@github.com/Soff-Hub/${{ secrets.REPO_NAME }}.git .
            else
                git pull origin test
            fi

            # .env faylini yuklash
            echo "${{ secrets.TEST_ENV_CONTENT }}" > .env

            # Kerakli kutubxonalarni o'rnatish va loyihani build qilish
            npm install
            npm run build

            # PM2 orqali jarayonlarni boshqarish
            pm2 reload ${{ secrets.REPO_NAME }}-test || pm2 start npm --name ${{ secrets.REPO_NAME }}-test -- start
            pm2 save
