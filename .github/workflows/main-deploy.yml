name: Soffcrm Frontend Production Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.12.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create environment files
        run: |
          echo "${{ secrets.PROD_ENV_CONTENT }}" > .env

      - name: Build application
        run: npm run build

      - name: Prepare deployment package
        run: |
          tar -czf deploy.tar.gz \
            .next/ \
            public/ \
            node_modules/ \
            package.json \
            package-lock.json \
            ecosystem.config.js \
            .env

      - name: Deploy to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: crmroot
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Execute deployment with lock
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: crmroot
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            APP_NAME="prod-subdomain-soffcrm-uz-3132"
            LOCK_FILE="/tmp/${APP_NAME}.lock"
            PORT=3129
            HEALTH_URL="http://localhost:${PORT}"

            if [ -f "$LOCK_FILE" ]; then
              PID=$(cat $LOCK_FILE)
              if ps -p $PID > /dev/null; then
                echo "ERROR: Another deployment is already running (PID: $PID). Exiting."
                exit 1
              else
                echo "Found stale lock file. Removing it."
                rm -f "$LOCK_FILE"
              fi
            fi

            # Create lock file with current PID
            echo $$ > "$LOCK_FILE"

            # Setup cleanup on exit
            trap 'rm -f "$LOCK_FILE"; echo "Removed lock file."' EXIT INT TERM

            PM2_COMMAND="pm2"

            which $PM2_COMMAND || {
              echo "PM2 not found, trying to find it..."
              POSSIBLE_PM2=$(find $HOME/.nvm -name pm2 -type f | head -n 1)
              if [ -n "$POSSIBLE_PM2" ]; then
                PM2_COMMAND="$POSSIBLE_PM2"
                echo "Found PM2 at: $PM2_COMMAND"
              else
                echo "ERROR: PM2 not found. Please install it with: npm install -g pm2"
                exit 1
              fi
            }

            TIMESTAMP=$(date +%s)
            BASE_DIR="/home/crmroot/frontend/prod-soffcrm"
            DEPLOY_DIR="${BASE_DIR}/${APP_NAME}"
            NEW_DEPLOY_DIR="${BASE_DIR}/${APP_NAME}-${TIMESTAMP}"

            echo "Start Deployment: $(date)"
            echo "New deploy folder: $NEW_DEPLOY_DIR"

            mkdir -p $NEW_DEPLOY_DIR

            echo "Extract Build files..."
            tar -xzf /tmp/deploy.tar.gz -C $NEW_DEPLOY_DIR

            cd $NEW_DEPLOY_DIR
            echo "Current folder: $(pwd)"

            if [ ! -f "node_modules/next/dist/bin/next" ]; then
              echo "ERROR: Next.js executable not found!"
              ls -la node_modules/next/dist/bin/ || echo "Directory doesn't exist"
              exit 1
            fi

            set -x

            if $PM2_COMMAND list | grep -q "$APP_NAME"; then
              echo "Available app found: $APP_NAME"

              echo "Launch new version..."
              $PM2_COMMAND start ecosystem.config.js --only "$APP_NAME-new" || true

              sleep 10

              if curl -s $HEALTH_URL/api/health > /dev/null || curl -s $HEALTH_URL > /dev/null; then
                echo "Looks like a new version is running"

                echo "Delete old version..."
                $PM2_COMMAND delete "$APP_NAME" || true

                echo "Launch base version..."
                $PM2_COMMAND start ecosystem.config.js --only "$APP_NAME" || true

                echo "Delete Temporary Version..."
                $PM2_COMMAND delete "$APP_NAME-new" || true

                $PM2_COMMAND save || true

                if [ -L "$DEPLOY_DIR" ]; then
                  echo "Deleting existing symbolic link..."
                  rm -f "$DEPLOY_DIR"
                elif [ -d "$DEPLOY_DIR" ]; then
                  echo "Backing up an existing folder..."
                  mv "$DEPLOY_DIR" "${DEPLOY_DIR}-old-$(date +%s)" || true
                fi

                echo "Creating new symbolic link..."
                ln -sf "$NEW_DEPLOY_DIR" "$DEPLOY_DIR"

                echo "Clear old versions..."
                cd $BASE_DIR
                ls -dt "${APP_NAME}-"* | grep -v "$(basename $NEW_DEPLOY_DIR)" | tail -n +3 | xargs -r rm -rf

                echo "The deployment was successful!"
              else
                echo "ERROR: New version unavailable!"

                $PM2_COMMAND delete "$APP_NAME-new" || true

                rm -rf "$NEW_DEPLOY_DIR"

                echo "Back to previous version."
              fi
            else
              echo "First deployment..."

              $PM2_COMMAND start ecosystem.config.js --only "$APP_NAME" || true
              $PM2_COMMAND save || true

              if [ -L "$DEPLOY_DIR" ]; then
                rm -f "$DEPLOY_DIR"
              elif [ -d "$DEPLOY_DIR" ]; then
                mv "$DEPLOY_DIR" "${DEPLOY_DIR}-old-$(date +%s)" || true
              fi

              ln -sf "$NEW_DEPLOY_DIR" "$DEPLOY_DIR"

              echo "The first deployment was successful!"
            fi

            echo "PM2 processes:"
            $PM2_COMMAND list

            echo "Frontend Folder Files:"
            ls -la $BASE_DIR

            rm -f /tmp/deploy.tar.gz
